name: Build Zehn AI APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keystore-gen-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, Test & Sign APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Set up Gradle 8.10.2 (wrapper-independent)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Auto-generate or restore debug keystore
        run: |
          if [ -f app/debug.keystore ]; then
            echo "✅ app/debug.keystore exists in repo. Using it."
          else
            echo "⚠️ app/debug.keystore missing."
            if [ "${{ github.event_name }}" == "push" ] && [ "${{ github.ref }}" == "refs/heads/main" ]; then
              echo "Push to main detected. Generating permanent debug.keystore..."
              mkdir -p app
              keytool -genkey -v -keystore app/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Zehn AI,O=Zehn,C=PK"
              git config --global user.name "github-actions[bot]"
              git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git pull origin main --rebase || true
              git add -f app/debug.keystore
              git commit -m "chore(keystore): auto-generate permanent app/debug.keystore [skip ci]" || true
              git push origin main || echo "Push skipped or not needed"
            else
              echo "Branch build or PR build. Creating temporary keystore in runner only (not committed)."
              mkdir -p app
              keytool -genkey -v -keystore app/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Zehn AI,O=Zehn,C=PK"
              echo "⚠️ WARNING: debug.keystore was missing on this branch/PR build. A temporary keystore was created in the runner only. This APK cannot update an installed app signed with a permanent keystore." >> $GITHUB_STEP_SUMMARY
            fi
          fi

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Verify Debug APK
        run: |
          DEBUG_APK=$(find app/build/outputs/apk/debug -maxdepth 1 -name "*.apk" | head -n 1)
          if [ -z "$DEBUG_APK" ] || [ ! -s "$DEBUG_APK" ]; then
            echo "Debug APK was not generated or is empty."
            exit 1
          fi
          ls -lh "$DEBUG_APK"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zehn-ai-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Run Unit & Robolectric Tests (Non-Blocking)
        continue-on-error: true
        run: gradle testDebugUnitTest --stacktrace

      - name: Summarize Unit Test Results
        if: always()
        run: |
          python3 - << 'PY'
          import glob
          import os
          import re
          import xml.etree.ElementTree as ET

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY", "")
          xml_files = sorted(glob.glob("app/build/test-results/**/*.xml", recursive=True))

          total_tests = 0
          total_failures = 0
          total_errors = 0
          total_skipped = 0
          failed_cases = []

          for path in xml_files:
              try:
                  tree = ET.parse(path)
                  root = tree.getroot()
              except Exception as exc:
                  failed_cases.append((path, "XML parse error", "-", "-", str(exc)))
                  continue

              suites = [root] if root.tag == "testsuite" else root.findall("testsuite")
              for suite in suites:
                  total_tests += int(suite.attrib.get("tests", 0))
                  total_failures += int(suite.attrib.get("failures", 0))
                  total_errors += int(suite.attrib.get("errors", 0))
                  total_skipped += int(suite.attrib.get("skipped", 0))

                  for tc in suite.findall("testcase"):
                      issue = tc.find("failure")
                      if issue is None:
                          issue = tc.find("error")
                      if issue is None:
                          continue
                      cls = tc.attrib.get("classname", "")
                      name = tc.attrib.get("name", "")
                      full_name = f"{cls} > {name}" if cls else name
                      msg = (issue.attrib.get("message") or (issue.text or "")).strip()
                      m = re.search(r"expected:\s*<(.*?)>\s*but was:\s*<(.*?)>", msg, re.DOTALL)
                      if not m and issue.text:
                          m = re.search(r"expected:\s*<(.*?)>\s*but was:\s*<(.*?)>", issue.text, re.DOTALL)
                      expected = m.group(1) if m else "-"
                      actual = m.group(2) if m else "-"
                      failed_cases.append((full_name, issue.attrib.get("type", "Failure"), expected, actual, msg[:400]))

          lines = [
              "## Unit Test Results",
              f"- **Total:** {total_tests} | **Failures:** {total_failures} | **Errors:** {total_errors} | **Skipped:** {total_skipped}",
          ]
          if not xml_files:
              lines.append("- No XML test result files found under `app/build/test-results`.")
          elif not failed_cases:
              lines.append("- All unit tests passed.")
          else:
              lines.append("")
              lines.append("| Failed Test | Expected | Actual | Details |")
              lines.append("| --- | --- | --- | --- |")
              for full_name, typ, expected, actual, msg in failed_cases:
                  def esc(s):
                      return str(s).replace("|", "\\|").replace("\n", " ").strip()
                  lines.append(f"| `{esc(full_name)}` | `{esc(expected)}` | `{esc(actual)}` | {esc(typ)}: {esc(msg)} |")

          output = "\n".join(lines) + "\n"
          print(output)
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as f:
                  f.write(output)
          PY

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zehn-ai-test-reports
          path: app/build/reports/tests
          if-no-files-found: warn
          retention-days: 30
